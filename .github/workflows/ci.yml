name: PR Validate

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: voiceshield
      POSTGRES_USER: voiceshield
      POSTGRES_PASSWORD: voiceshield
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: voiceshield
          POSTGRES_USER: voiceshield
          POSTGRES_PASSWORD: voiceshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U voiceshield -d voiceshield"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew clean test
